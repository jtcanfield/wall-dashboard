# Installed to /etc/lightdm/lightdm.conf.d/50-wall-autologin.conf
#
# No greeter, no password, straight into XFCE at boot. A drop-in rather than an
# edit to lightdm.conf so a package upgrade cannot quietly revert it.
#
# nodm would also do this and is still in trixie at 132 kB, but LightDM is what
# XFCE expects: it creates a proper logind session, which is what makes polkit
# work — and polkit is what lets Thunar mount the USB stick the 3D print files
# arrive on. That is worth a few MB on a machine with 8 GB.
[Seat:*]
autologin-user=kiosk
autologin-user-timeout=0
autologin-session=xfce

# Nothing should ever lock this screen. The session has no password prompt by
# design, so a lock screen would be a door with no key on a wall-mounted panel.
greeter-hide-users=true
